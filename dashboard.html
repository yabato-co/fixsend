<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fix Pack Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="fixsend-logo.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="fixsend-logo.svg" />
    <link rel="stylesheet" href="dashboard.css" />
  </head>
  <body>
    <main class="dashboard-page">
      <header class="dashboard-topbar">
        <a class="dashboard-brand" href="index.html">
          <span><img src="fixsend-logo.svg" alt="" /></span>
          <strong>FixSend Fix Pack</strong>
        </a>
        <p>Private dashboard</p>
      </header>

      <section class="dashboard-hero" id="dashboardHero">
        <div>
          <p class="eyebrow">Loading dashboard</p>
          <h1>Your Fix Pack is being prepared...</h1>
          <p>One moment while we load your private dashboard.</p>
        </div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="fixpack-engine.js"></script>
    <script src="dashboard.js"></script>
  </body>
</html>
