<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Your Fix Pack Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="fixsend-logo.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="fixsend-logo.svg" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="index.html">
        <span class="brand-mark"><img src="fixsend-logo.svg" alt="" /></span>
        <span>
          <strong>FixSend</strong>
          <small>Fix Pack dashboard</small>
        </span>
      </a>
    </header>

    <main>
      <section class="section tool-section">
        <div class="section-heading">
          <p class="eyebrow">Private dashboard</p>
          <h1>Create your Fix Pack dashboard.</h1>
          <p>
            Submit your purchase email, CV, target role, and FixSend score. Your private
            dashboard link will be generated automatically.
          </p>
        </div>

        <form class="tool-grid" id="fixPackForm">
          <label class="field">
            <span>Full name</span>
            <input id="fullName" type="text" placeholder="Your name" />
          </label>

          <label class="field">
            <span>Purchase email</span>
            <input id="email" type="email" placeholder="you@example.com" required />
          </label>

          <label class="field">
            <span>Target role</span>
            <select id="targetRole" required>
              <option value="ux-designer">UX Designer</option>
              <option value="ui-designer">UI Designer</option>
              <option value="product-designer">Product Designer</option>
              <option value="web-designer">Web Designer</option>
              <option value="graphic-designer">Graphic Designer</option>
              <option value="frontend-developer">Frontend Developer</option>
              <option value="junior-designer">Junior Designer</option>
              <option value="career-switcher">Career Switcher</option>
            </select>
          </label>

          <label class="field">
            <span>FixSend score</span>
            <input id="fixsendScore" type="text" placeholder="Example: 6.8 / 10" />
          </label>

          <label class="field cv-field">
            <span>CV text</span>
            <textarea
              id="cvText"
              rows="15"
              placeholder="Paste the readable text from your CV here."
              required
            ></textarea>
          </label>

          <div class="form-actions">
            <button class="button primary" type="submit" id="submitButton">
              Create dashboard
            </button>
            <p id="submitMessage" class="form-message" role="alert"></p>
          </div>
        </form>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="fixpack-engine.js"></script>
    <script src="submit.js"></script>
  </body>
</html>
